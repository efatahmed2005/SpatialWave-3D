<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#070910"/>
    </radialGradient>
    <linearGradient id="neonCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="60%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- 3D Spatial Orbital Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#neonCyanViolet)" stroke-width="12" stroke-dasharray="20 10" transform="rotate(-25 256 256)" filter="url(#glowFilter)"/>

  <!-- Orbiting 3D Sound Source Emitter -->
  <circle cx="390" cy="190" r="16" fill="#00f5d4" filter="url(#glowFilter)"/>
  <circle cx="390" cy="190" r="26" fill="none" stroke="#00f5d4" stroke-width="3" opacity="0.6"/>

  <!-- Center Listener Headphone Motif -->
  <!-- Headband -->
  <path d="M 176 270 A 90 90 0 0 1 336 270" fill="none" stroke="#f0f4fc" stroke-width="18" stroke-linecap="round"/>
  <!-- Headband cushion -->
  <path d="M 195 240 A 80 80 0 0 1 317 240" fill="none" stroke="#00f5d4" stroke-width="8" stroke-linecap="round" filter="url(#glowFilter)"/>

  <!-- Left Earcup -->
  <rect x="156" y="245" width="28" height="65" rx="14" fill="#7b2cbf" stroke="#00f5d4" stroke-width="4" filter="url(#glowFilter)"/>
  <!-- Right Earcup -->
  <rect x="328" y="245" width="28" height="65" rx="14" fill="#7b2cbf" stroke="#00f5d4" stroke-width="4" filter="url(#glowFilter)"/>

  <!-- Binaural Sound Waves emitting from center -->
  <path d="M 230 330 Q 256 315 282 330" fill="none" stroke="#00f5d4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 210 355 Q 256 335 302 355" fill="none" stroke="#7b2cbf" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 190 380 Q 256 355 322 380" fill="none" stroke="#f72585" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
</svg>
